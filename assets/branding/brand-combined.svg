<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 600" width="2100" height="600">
  <defs>
    <style>
      .mono-meta { font-family: 'Liberation Mono', 'Courier New', monospace; font-size: 11px; fill: #94A3B8; letter-spacing: 0.14em; text-transform: uppercase; font-weight: bold; }
      .mono-val { font-family: 'Liberation Mono', 'Courier New', monospace; font-size: 13.5px; fill: #F1F5F9; font-weight: normal; letter-spacing: 0.02em; }
      .brand-title { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 82px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.04em; }
      .brand-title-accent { fill: #38BDF8; font-weight: 800; }
      .brand-desc { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 19px; font-weight: 400; fill: #CBD5E1; letter-spacing: -0.01em; line-height: 1.5; }
      .brand-tag { font-family: 'Liberation Mono', monospace; font-size: 11px; font-weight: bold; fill: #38BDF8; letter-spacing: 0.16em; text-transform: uppercase; }
      .hairline { stroke: #262D3D; stroke-width: 1; }
      .hairline-subtle { stroke: #1E2330; stroke-width: 1; }
      .avatar-meta { font-family: 'Liberation Mono', 'Courier New', monospace; font-size: 10px; fill: #94A3B8; letter-spacing: 0.18em; font-weight: bold; }
    </style>
  </defs>

  <!-- ==================== FRAME 1: BANNER (1500 x 500 at x: 0, y: 50) ==================== -->
  <g id="banner-minimalist-dark" transform="translate(0, 50)">
    <!-- Background: Deep solid obsidian -->
    <rect width="1500" height="500" fill="#090A0F" />

    <!-- Left Avatar Safe Zone Boundary (410px) -->
    <line x1="410" y1="0" x2="410" y2="500" class="hairline" />

    <!-- Horizontal structural dividers -->
    <line x1="410" y1="90" x2="1500" y2="90" class="hairline-subtle" />
    <line x1="0" y1="405" x2="1500" y2="405" class="hairline" />

    <!-- LEFT PANEL: Technical Coordinates -->
    <g transform="translate(60, 60)">
      <rect x="0" y="0" width="8" height="8" fill="#38BDF8" />
      <text x="20" y="8" class="mono-meta">ARCH // 01</text>

      <text x="0" y="135" class="mono-meta">PROTOCOL</text>
      <text x="0" y="158" class="mono-val">SEP-CCTP-01</text>

      <text x="0" y="210" class="mono-meta">ECOSYSTEM</text>
      <text x="0" y="233" class="mono-val">STELLAR · SOROBAN</text>

      <text x="0" y="285" class="mono-meta">SETTLEMENT</text>
      <text x="0" y="308" class="mono-val">CIRCLE CCTP v1</text>
    </g>

    <!-- Top Metadata Bar -->
    <g transform="translate(460, 56)">
      <circle cx="0" cy="-4" r="3" fill="#38BDF8" />
      <text x="14" y="0" class="brand-tag">CROSS-CHAIN SETTLEMENT ENGINE</text>
      <text x="800" y="0" class="mono-meta">MAINNET READY · v1.0.0</text>
    </g>

    <!-- Center Typography Hero -->
    <g transform="translate(460, 192)">
      <text x="0" y="0" class="brand-title">Anchor<tspan class="brand-title-accent">CCTP</tspan></text>
      <text x="0" y="44" class="brand-desc">Zero-slippage native USDC settlement infrastructure for Stellar anchors.</text>
      <text x="0" y="74" class="brand-desc">Direct on-chain mint and burn via Circle CCTP · Verified by Soroban contracts.</text>
    </g>

    <!-- Right Geometric Architectural Emblem -->
    <g transform="translate(1270, 235)">
      <circle cx="0" cy="0" r="140" fill="none" stroke="#161A24" stroke-width="1" />
      <circle cx="0" cy="0" r="110" fill="none" stroke="#222838" stroke-width="1" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="80" fill="none" stroke="#2A3245" stroke-width="1" />

      <line x1="0" y1="-65" x2="0" y2="60" stroke="#FFFFFF" stroke-width="5" stroke-linecap="square" />
      <line x1="-36" y1="-25" x2="36" y2="-25" stroke="#FFFFFF" stroke-width="4" stroke-linecap="square" />
      
      <circle cx="0" cy="-65" r="12" fill="none" stroke="#38BDF8" stroke-width="4" />
      <circle cx="0" cy="-65" r="4" fill="#38BDF8" />

      <path d="M -54 20 C -54 58, 54 58, 54 20" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="square" />
      
      <polygon points="-54,20 -62,28 -46,28" fill="#FFFFFF" />
      <polygon points="54,20 46,28 62,28" fill="#FFFFFF" />

      <circle cx="-110" cy="0" r="4" fill="#38BDF8" />
      <circle cx="110" cy="0" r="4" fill="#FFFFFF" />
      <text x="-110" y="-14" text-anchor="middle" class="mono-meta">EVM</text>
      <text x="110" y="-14" text-anchor="middle" class="mono-meta">STELLAR</text>
    </g>

    <!-- Bottom Technical Bento Row -->
    <line x1="680" y1="405" x2="680" y2="500" class="hairline-subtle" />
    <line x1="950" y1="405" x2="950" y2="500" class="hairline-subtle" />
    <line x1="1220" y1="405" x2="1220" y2="500" class="hairline-subtle" />

    <g transform="translate(460, 440)">
      <text x="0" y="0" class="mono-meta">01 // TRANSFER ROUTE</text>
      <text x="0" y="26" class="mono-val">Ethereum · Arbitrum ⇄ Stellar</text>
    </g>

    <g transform="translate(710, 440)">
      <text x="0" y="0" class="mono-meta">02 // SETTLEMENT ASSET</text>
      <text x="0" y="26" class="mono-val">Native USDC (No Wrapped IOU)</text>
    </g>

    <g transform="translate(980, 440)">
      <text x="0" y="0" class="mono-meta">03 // CONTRACT CORE</text>
      <text x="0" y="26" class="mono-val">Soroban Rust · Audited</text>
    </g>

    <g transform="translate(1250, 440)">
      <text x="0" y="0" class="mono-meta">04 // STANDARD</text>
      <text x="0" y="26" class="mono-val">SEP-24 · SEP-31 · SEP-38</text>
    </g>
  </g>

  <!-- ==================== FRAME 2: AVATAR (400 x 400 at x: 1600, y: 100) ==================== -->
  <g id="avatar-minimalist-dark" transform="translate(1600, 100)">
    <!-- Background: Deep solid obsidian -->
    <rect width="400" height="400" fill="#090A0F" />

    <!-- Circular Safe-Zone Marker -->
    <circle cx="200" cy="200" r="180" fill="none" stroke="#161A24" stroke-width="1" />
    <circle cx="200" cy="200" r="145" fill="none" stroke="#222838" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="200" cy="200" r="110" fill="none" stroke="#1E2330" stroke-width="1" />

    <!-- Crosshair Coordinates -->
    <line x1="20" y1="200" x2="60" y2="200" stroke="#262D3D" stroke-width="1" />
    <line x1="340" y1="200" x2="380" y2="200" stroke="#262D3D" stroke-width="1" />
    <line x1="200" y1="20" x2="200" y2="60" stroke="#262D3D" stroke-width="1" />
    <line x1="200" y1="340" x2="200" y2="380" stroke="#262D3D" stroke-width="1" />

    <text x="200" y="52" text-anchor="middle" class="avatar-meta">CCTP // STELLAR</text>

    <!-- Central Anchor Mark -->
    <g transform="translate(200, 202)">
      <line x1="0" y1="-85" x2="0" y2="75" stroke="#FFFFFF" stroke-width="7" stroke-linecap="square" />
      <line x1="-48" y1="-32" x2="48" y2="-32" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square" />
      
      <rect x="-52" y="-36" width="4" height="8" fill="#38BDF8" />
      <rect x="48" y="-36" width="4" height="8" fill="#38BDF8" />

      <circle cx="0" cy="-85" r="16" fill="none" stroke="#38BDF8" stroke-width="5" />
      <circle cx="0" cy="-85" r="5" fill="#38BDF8" />

      <path d="M -72 26 C -72 78, 72 78, 72 26" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="square" />
      
      <polygon points="-72,26 -82,38 -62,38" fill="#FFFFFF" />
      <polygon points="72,26 62,38 82,38" fill="#FFFFFF" />

      <circle cx="0" cy="75" r="5" fill="#FFFFFF" />
    </g>
  </g>
</svg>

