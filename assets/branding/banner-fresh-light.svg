<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="mark-blue-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="mark-charcoal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232D" />
      <stop offset="100%" stop-color="#0F1218" />
    </linearGradient>
  </defs>

  <style>
    .display-font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Geist Sans", "Helvetica Neue", Arial, sans-serif; }
    .mono-font { font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- 1. Warm Bone Editorial Canvas -->
  <rect width="1500" height="500" fill="#F8F7F4" />

  <!-- 2. Hairline Structural Dividers -->
  <line x1="380" y1="0" x2="380" y2="500" stroke="#E5E2DA" stroke-width="1" />
  <line x1="380" y1="360" x2="1500" y2="360" stroke="#E5E2DA" stroke-width="1" />

  <!-- 3. Left Metadata Column (Safe area for avatar) -->
  <g transform="translate(60, 60)">
    <text x="0" y="20" fill="#9C978B" class="mono-font" font-size="11" font-weight="600" letter-spacing="2">SPECIFICATION</text>
    <text x="0" y="42" fill="#1C1E24" class="mono-font" font-size="13" font-weight="600">SEP-CCTP-01</text>

    <text x="0" y="100" fill="#9C978B" class="mono-font" font-size="11" font-weight="600" letter-spacing="2">DEPLOYMENT</text>
    <text x="0" y="122" fill="#1D4ED8" class="mono-font" font-size="13" font-weight="600">MAINNET LIVE</text>

    <text x="0" y="180" fill="#9C978B" class="mono-font" font-size="11" font-weight="600" letter-spacing="2">LICENSE</text>
    <text x="0" y="202" fill="#1C1E24" class="mono-font" font-size="13">APACHE 2.0</text>
  </g>

  <!-- 4. Center Main Editorial -->
  <text x="440" y="90" fill="#1D4ED8" class="mono-font" font-size="12" font-weight="600" letter-spacing="2">
    STELLAR PROTOCOL EXTENSION
  </text>

  <text x="436" y="180" fill="#111318" class="display-font" font-size="82" font-weight="900" letter-spacing="-3">
    Anchor<tspan fill="#1D4ED8">CCTP</tspan>
  </text>

  <text x="440" y="235" fill="#3E4554" class="display-font" font-size="22" font-weight="400" letter-spacing="-0.3">
    Native USDC settlement engine for Stellar anchors.
  </text>
  <text x="440" y="268" fill="#717A8C" class="display-font" font-size="17" font-weight="400">
    Enabling seamless cross-chain minting and burning verified by Circle attestations.
  </text>

  <!-- Spec Table (Clean and ultra-crisp) -->
  <g transform="translate(440, 410)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#8C94A4" class="mono-font" font-size="10" letter-spacing="1">BRIDGE ROUTE</text>
      <text x="0" y="22" fill="#111318" class="mono-font" font-size="13" font-weight="600">EVM ⇄ Stellar</text>
    </g>

    <g transform="translate(220, 0)">
      <text x="0" y="0" fill="#8C94A4" class="mono-font" font-size="10" letter-spacing="1">SETTLEMENT ASSET</text>
      <text x="0" y="22" fill="#111318" class="mono-font" font-size="13" font-weight="600">Native USDC</text>
    </g>

    <g transform="translate(440, 0)">
      <text x="0" y="0" fill="#8C94A4" class="mono-font" font-size="10" letter-spacing="1">SOROBAN CONTRACTS</text>
      <text x="0" y="22" fill="#111318" class="mono-font" font-size="13" font-weight="600">Verified On-Chain</text>
    </g>

    <g transform="translate(660, 0)">
      <text x="0" y="0" fill="#8C94A4" class="mono-font" font-size="10" letter-spacing="1">CORE REPO</text>
      <text x="0" y="22" fill="#1D4ED8" class="mono-font" font-size="13" font-weight="600">github.com/lunox-network</text>
    </g>
  </g>

